[package]
name = "justless"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Local command output and source context for coding agents"
license = "Apache-2.0"
repository = "https://github.com/rishadbaniya/justless"

[dependencies]
anyhow = "1"
clap = { version = "3.2", default-features = false, features = ["std"] }
# Groovy: the tree-sitter-groovy crate misparses Spock feature methods and Gradle DSL calls.
dekobon-tree-sitter-groovy = "0.6"
httparse = "1.10"
ignore = "0.4.34"
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }
shlex = "2"
tree-sitter = "0.26.9"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.3"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-julia = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-objc = "3.0"
tree-sitter-php = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
