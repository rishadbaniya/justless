name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Match the tag to Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate."
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement at 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Apple silicon runners build both macOS targets. Apple clang compiles
          # the Tree-sitter grammars for either architecture.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      ASSET: justless-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          # Link the C runtime statically so the Windows binary needs no VC++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/$ASSET"
          cp "target/${{ matrix.target }}/release/justless" README.md "dist/$ASSET/"
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/$env:ASSET" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/justless.exe", README.md "dist/$env:ASSET/"
          Compress-Archive -Path "dist/$env:ASSET" -DestinationPath "dist/$env:ASSET.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -- --repo "$GITHUB_REPOSITORY" --title "Justless $VERSION" --generate-notes --verify-tag
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "$@"
