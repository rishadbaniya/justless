<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" role="img" aria-labelledby="t d">
<title id="t">justless demo: a failing cargo test, then an exact log replay</title>
<desc id="d">The agent runs cargo test; the hook routes it through justless run, which returns 9 lines instead of 380 and names the run. The agent then replays lines 365 to 368 of the archived stdout. Captured output:
$ cargo test
1 reported failing test(s)
1 test(s): total_includes_fee tests/checkout.rs:11:5: assertion `left == right` failed left: 106 right: 105 [stdout:365-368]
test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s
test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s
    Finished `test` profile [unoptimized + debuginfo] target(s) in 0.00s
     Running unittests src/lib.rs (target/debug/deps/checkout_fixture-4b58a8d3c9315df3)
     Running tests/checkout.rs (target/debug/deps/checkout-08b118bf0c4a4cc2)
error: test failed, to rerun pass `--test checkout`
[justless run-5JrBaF3zTLSD · 634 B of 17.6 KB shown · exit 101]
$ justless log run-5JrBaF3zTLSD --stream stdout --from 365 --to 368
thread 'total_includes_fee' (3306235) panicked at tests/checkout.rs:11:5:
assertion `left == right` failed
  left: 106
 right: 105
</desc>
