<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-label="The same failing cargo test run twice. Without justless the agent receives 380 lines (18,038 bytes), 351 of them trace lines the test prints. With justless, which the hook routes the command through, it receives 9 lines (700 bytes): the failing test, its assertion and location, exit code 101 and a run ID. justless log then replays the original assertion lines exactly.">
<title>Before and after justless: cargo test</title>
