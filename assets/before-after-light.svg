<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-label="The same failing cargo test run twice. Without justless the agent receives 380 lines (18,038 bytes). With justless, routed by the hook, it receives 9 lines (517 bytes, 97% smaller): the failing test, its assertion, collapsed empty target, exit code 101 and run ID run-pHKV4nNjVk9q. justless log then replays the original assertion lines exactly.">
