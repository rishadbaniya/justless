<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 736" width="880" height="736" role="img" aria-labelledby="t d">
<title id="t">Bytes an agent received: 1,171 KB raw versus 115 KB with justless, 90% smaller, across 77 real commands.</title>
<desc id="d">Paired horizontal bars for 12 command types, sorted by raw size, on a linear 0 to 300 KB axis. git diff (older revisions): 274.3 KB raw, 13.5 KB with justless; find .: 267.4 KB raw, 9.4 KB with justless; grep -rn: 200.1 KB raw, 16.4 KB with justless; git log: 143.1 KB raw, 24.9 KB with justless; git ls-files: 67.3 KB raw, 9.2 KB with justless; rg: 63.1 KB raw, 8.4 KB with justless; ls: 42.4 KB raw, 12.1 KB with justless; cargo test: 34.4 KB raw, 4.0 KB with justless; cat (large file): 32.9 KB raw, 5.2 KB with justless; cargo check (successful builds): 26.5 KB raw, 0.5 KB with justless; git show: 10.0 KB raw, 3.3 KB with justless; cargo clippy: 3.8 KB raw, 0.5 KB with justless. Source: 77 real commands across four Rust and Python repositories; the total covers all 77.</desc>
