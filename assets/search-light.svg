<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 773" width="1000" height="773" role="img" aria-label="A search with lots of output. Without justless, rg -n &quot;fn &quot; src prints 2,512 lines (185,877 bytes), one per match. With justless run, the agent receives 64 lines (2,837 bytes): rg: 2512 matches in 79 files, then 15 files ordered by match count, each with its match count, two sample lines and the range of its lines in the archived output, then one line summarizing the other 64 files, and a footer with the run ID. This picture leaves out 48 lines of the grouped report and most of the raw output. justless log run-y4HDejPf3RCk --stream stdout --from 245 --to 247 then returns lines 245 to 247 of the original output exactly, including a match the report did not show. 66 times fewer bytes.">
