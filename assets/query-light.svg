<text x="20.0" y="502.0" class="m" fill="#1f2328">/// Whether the Claude Code command hook would route all </text>
<text x="34.4" y="518.0" class="m" fill="#1f2328">or part of this command</text>
<text x="20.0" y="534.0" class="m" fill="#1f2328">/// through Justless in a project with these </text>
<text x="34.4" y="550.0" class="m" fill="#1f2328">`exclude_commands`. Each `cd` is</text>
<text x="20.0" y="566.0" class="m" fill="#1f2328">/// checked by its words alone, so a link that leaves the </text>
<text x="34.4" y="582.0" class="m" fill="#1f2328">workspace is not</text>
<text x="20.0" y="598.0" class="m" fill="#1f2328">/// detected here.</text>
<text x="20.0" y="614.0" class="m" fill="#1f2328">pub fn would_route(command: &amp;str, exclusions: </text>
<text x="34.4" y="630.0" class="m" fill="#1f2328">&amp;crate::rewrite::Exclusions) -&gt; bool {</text>
<text x="20.0" y="646.0" class="m" fill="#1f2328">    // `wrap_event` leaves an excluded line, and a read </text>
<text x="63.2" y="662.0" class="m" fill="#1f2328">list to the post-command hook.</text>
<text x="20.0" y="678.0" class="m" fill="#1f2328">    if exclusions.line(command).is_some()</text>
<text x="20.0" y="694.0" class="m" fill="#1f2328">        || !cfg!(windows)</text>
<text x="20.0" y="710.0" class="m" fill="#1f2328">            &amp;&amp; crate::batch::Batch::parse_list(command).is</text>
<text x="120.8" y="726.0" class="m" fill="#1f2328">_some_and(|batch| batch.reads_only())</text>
<text x="20.0" y="742.0" class="m" fill="#1f2328">    {</text>
<text x="20.0" y="758.0" class="m" fill="#1f2328">        return false;</text>
<text x="20.0" y="774.0" class="m" fill="#1f2328">    }</text>
<text x="20.0" y="790.0" class="m" fill="#1f2328">    let rules = Rules {</text>
<text x="20.0" y="806.0" class="m" fill="#1f2328">        mixed: true,</text>
<text x="20.0" y="822.0" class="m" fill="#1f2328">        claude: true,</text>
<text x="20.0" y="838.0" class="m" fill="#1f2328">        approves: false,</text>
<text x="20.0" y="854.0" class="m" fill="#1f2328">        ask_safe: false,</text>
<text x="20.0" y="870.0" class="m" fill="#1f2328">        script: false,</text>
<text x="20.0" y="886.0" class="m" fill="#1f2328">        pipes: false,</text>
<text x="20.0" y="902.0" class="m" fill="#1f2328">    };</text>
<text x="20.0" y="918.0" class="m" fill="#1f2328">    let mut plan = plan(command, rules, |_| true);</text>
<text x="20.0" y="934.0" class="m" fill="#1f2328">    plan.exclude(command, rules, exclusions);</text>
<text x="20.0" y="950.0" class="m" fill="#1f2328">    !plan.wrap.is_empty()</text>
<text x="20.0" y="966.0" class="m" fill="#1f2328">}</text>
