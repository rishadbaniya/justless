<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" role="img" aria-labelledby="t d">
<title id="t">justless demo: a failing cargo test, then an exact log replay</title>
<desc id="d">The agent runs cargo test; the hook routes it through justless run, which returns 9 lines instead of 380 and names the run.
The agent then replays lines 365 to 368 of the archived stdout. Captured output:
$ cargo test
1 reported failing test(s)
1 test(s): total_includes_fee tests/checkout.rs:11:5: assertion `left == right` failed left: 106 right: 105 [stdout:365-368]
test result: FAILED. 0 passed; 1 failed; 0 ignored · 2 test binaries
  0 passed, 1 failed  tests/checkout.rs [stdout:7-375]
  1 ran no tests: unittests src/lib.rs
stderr: 3 cargo status line(s) [stderr:1-3]
stderr: 1 other line(s) [stderr:4-4]
  error: test failed, to rerun pass `--test checkout`
[justless run-pHKV4nNjVk9q · 451 B of 17.6 KB shown · exit 101]
$ justless log run-pHKV4nNjVk9q --stream stdout --from 365 --to 368
thread 'total_includes_fee' (3760864) panicked at tests/checkout.rs:11:5:
assertion `left == right` failed
  left: 106
 right: 105
</desc>
